[config]
include = ["flows"]

[[sources]]
name = "mongo_src"
type = "mongodb"
config = { url = "${MONGO_URL}", database = "appdb" }

[[sinks]]
name = "pg_sink"
type = "postgres"
config = { url = "${PG_SINK_URL}" }

[[storages]]
name = "pg_state"
type = "postgres"
config = { url = "${PG_STATE_URL}" }

# Manual smoke exercises the full /metrics surface — `scripts/metrics.py`
# polls this endpoint and asserts the contract (expected names, monotonic
# counters, non-zero process CPU sample).
[metrics.prometheus]
enabled = true
port = 8090
