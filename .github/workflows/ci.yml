name: CI

on:
  # Run on every PR for feature branches; on `main` we still need a
  # post-merge run to keep the default-branch status green. Without the
  # `branches` filter, a push to a branch with an open PR fires the
  # whole pipeline twice (once per trigger).
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs for the same ref when a new commit arrives —
# avoids two builds racing each other when you push twice in quick
# succession. `pull_request` runs key on `github.head_ref`; `push` keys
# on `github.ref` (the branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: air-elt-lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Citus image is wire-compatible with stock Postgres and ships
        # the postgresql-hll extension preinstalled. The local
        # testcontainers handle uses the same image; matching it here
        # keeps CI and dev parity. Pinned to 13.1.
        image: citusdata/citus:13.1
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # tmpfs on the data dir: GHA `services` cannot override CMD, so
        # the durability flags `-c fsync=off` etc. that we set on the
        # local testcontainers config don't apply here. tmpfs alone still
        # buys most of the win because syscalls hit RAM.
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --tmpfs=/var/lib/postgresql/data:rw,size=512m
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: airelt
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --tmpfs=/var/lib/mysql:rw,size=512m
      mariadb:
        # Pinned to 11.x: native UUID column (added in 10.7) is required by
        # the MariaDB e2e suite. Mapped to host port 3307 so it doesn't
        # collide with the mysql service.
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
          MARIADB_DATABASE: airelt
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --tmpfs=/var/lib/mysql:rw,size=512m
    env:
      # `?sslmode=disable`: Citus generates a self-signed cert at boot
      # that sqlx's rustls layer rejects (`UnsupportedCertVersion`).
      # Loopback in CI doesn't benefit from TLS; disabling matches the
      # local testcontainers handle.
      AIR_ELT_TEST_PG_URL: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
      AIR_ELT_TEST_MYSQL_URL: "mysql://root@localhost:3306/airelt"
      AIR_ELT_TEST_MARIADB_URL: "mysql://root@localhost:3307/airelt"
      AIR_ELT_TEST_MONGO_URL: "mongodb://localhost:27017"
      AIR_ELT_TEST_MONGO_LEGACY_URL: "mongodb://localhost:27018"
      AIR_ELT_TEST_MONGO_RS_URL: "mongodb://localhost:27019/?replicaSet=rs0&directConnection=true"
      AIR_ELT_TEST_COCKROACHDB_URL: "postgres://root@localhost:26257/defaultdb?sslmode=disable"
      AIR_ELT_TEST_CLICKHOUSE_URL: "http://localhost:8123"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.95.0"
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: air-elt-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Start standalone Mongo (modern + legacy)
        # GHA `services:` cannot override CMD, so we cannot pass
        # `mongod --quiet` to silence per-connection NETWORK/ACCESS log
        # spam (healthcheck pings every 5 s produce megabytes of JSON
        # over a CI run). Run as plain `docker run` instead.
        run: |
          set -euo pipefail
          for spec in "mongo:8.0 27017 mongo-modern" "mongo:7.0 27018 mongo-legacy"; do
            read -r image port name <<<"$spec"
            docker run -d --name "$name" -p "$port:27017" \
              --tmpfs /data/db:rw,size=512m \
              "$image" mongod --quiet --bind_ip_all
          done
          for name in mongo-modern mongo-legacy; do
            for i in $(seq 1 30); do
              if docker exec "$name" mongosh --quiet --eval 'db.runCommand({ping:1}).ok' \
                  | grep -q '^1$'; then
                echo "$name ready after ${i}s"; break
              fi
              sleep 1
            done
          done
      - name: Start replica-set Mongo for mongo-cdc
        # GHA `services:` runs the image's default CMD and offers no
        # way to append `--replSet`, so we boot the RS node as a
        # plain `docker run`. mongo:8 with `--replSet rs0
        # --bind_ip_all` is the same shape used by `mongo_rs_pool`
        # locally. We also run `replSetInitiate` and wait for primary;
        # AlreadyInitialized is treated as a no-op so re-runs of this
        # step (e.g. cached job replays) stay idempotent.
        run: |
          set -euo pipefail
          docker run -d --name mongo-rs -p 27019:27017 \
            --tmpfs /data/db:rw,size=512m \
            mongo:8.0 mongod --quiet --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec mongo-rs mongosh --quiet --eval 'db.runCommand({ping:1}).ok' \
                | grep -q '^1$'; then break; fi
            sleep 1
          done
          docker exec mongo-rs mongosh --quiet --eval '
            try {
              rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]});
            } catch (e) {
              if (e.codeName !== "AlreadyInitialized") { throw e; }
            }
            for (let i = 0; i < 30; i++) {
              if (db.hello().isWritablePrimary) { quit(0); }
              sleep(1000);
            }
            throw new Error("rs primary did not come up in 30s");
          '
      - name: Start CockroachDB single-node
        # GHA `services:` cannot append a custom CMD (cockroach's image
        # ENTRYPOINT needs `start-single-node --insecure` as args, not env),
        # so we boot it via plain `docker run` — same pattern as the
        # mongo-rs step above. We then poll the SQL listener until ready;
        # `cockroach sql -e 'SELECT 1'` exits non-zero until the node has
        # finished startup.
        run: |
          set -euo pipefail
          docker run -d --name cockroach -p 26257:26257 \
            cockroachdb/cockroach:v25.1.0 start-single-node --insecure \
            --store=type=mem,size=1GiB
          for i in $(seq 1 30); do
            if docker exec cockroach \
                /cockroach/cockroach sql --insecure --host=localhost:26257 \
                -e 'SELECT 1' >/dev/null 2>&1; then
              echo "cockroach ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "cockroach did not become ready in 30s"
          docker logs cockroach || true
          exit 1
      - name: Start ClickHouse single-node
        # GHA `services:` cannot append a custom CMD; the official CH
        # image's default ENTRYPOINT spins up `clickhouse-server` which
        # is already what we want. We poll the `/ping` HTTP endpoint
        # rather than relying on a log marker so the container can be
        # any 24.x tag without re-tuning the wait. Pattern mirrors the
        # cockroach / mongo-rs steps above.
        run: |
          set -euo pipefail
          docker run -d --name clickhouse -p 8123:8123 -p 9000:9000 \
            --tmpfs /var/lib/clickhouse:rw,size=512m \
            -e CLICKHOUSE_SKIP_USER_SETUP=1 \
            clickhouse/clickhouse-server:24.8
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8123/ping >/dev/null 2>&1; then
              echo "clickhouse ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "clickhouse did not become ready in 60s"
          docker logs clickhouse || true
          exit 1
      - name: cargo test
        run: cargo test --workspace --all-targets
