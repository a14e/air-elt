name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: air-elt-lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: airelt
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mariadb:
        # Pinned to 11.x: native UUID column (added in 10.7) is required by
        # the MariaDB e2e suite. Mapped to host port 3307 so it doesn't
        # collide with the mysql service.
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
          MARIADB_DATABASE: airelt
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mongo-legacy:
        image: mongo:7.0
        ports:
          - 27018:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AIR_ELT_TEST_PG_URL: "postgres://postgres:postgres@localhost:5432/postgres"
      AIR_ELT_TEST_MYSQL_URL: "mysql://root@localhost:3306/airelt"
      AIR_ELT_TEST_MARIADB_URL: "mysql://root@localhost:3307/airelt"
      AIR_ELT_TEST_MONGO_URL: "mongodb://localhost:27017"
      AIR_ELT_TEST_MONGO_LEGACY_URL: "mongodb://localhost:27018"
      AIR_ELT_TEST_MONGO_RS_URL: "mongodb://localhost:27019/?replicaSet=rs0&directConnection=true"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: air-elt-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Start replica-set Mongo for mongo-cdc
        # GHA `services:` runs the image's default CMD and offers no
        # way to append `--replSet`, so we boot the RS node as a
        # plain `docker run`. mongo:8 with `--replSet rs0
        # --bind_ip_all` is the same shape used by `mongo_rs_pool`
        # locally. We also run `replSetInitiate` and wait for primary;
        # AlreadyInitialized is treated as a no-op so re-runs of this
        # step (e.g. cached job replays) stay idempotent.
        run: |
          set -euo pipefail
          docker run -d --name mongo-rs -p 27019:27017 \
            mongo:8.0 mongod --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec mongo-rs mongosh --quiet --eval 'db.runCommand({ping:1}).ok' \
                | grep -q '^1$'; then break; fi
            sleep 1
          done
          docker exec mongo-rs mongosh --quiet --eval '
            try {
              rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]});
            } catch (e) {
              if (e.codeName !== "AlreadyInitialized") { throw e; }
            }
            for (let i = 0; i < 30; i++) {
              if (db.hello().isWritablePrimary) { quit(0); }
              sleep(1000);
            }
            throw new Error("rs primary did not come up in 30s");
          '
      - name: cargo test
        run: cargo test --workspace --all-targets
