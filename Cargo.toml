[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/core",
    "crates/commons/lib",
    "crates/commons/pg",
    "crates/commons/mysql",
    "crates/commons/testing",
    "crates/commons/mongodb",
    "crates/commons/clickhouse",
    "crates/sources/postgres",
    "crates/sources/mysql",
    "crates/sources/mongodb",
    "crates/sources/mongo-cdc",
    "crates/sinks/postgres",
    "crates/sinks/mysql",
    "crates/sinks/mongodb",
    "crates/sinks/clickhouse",
    "crates/storages/postgres",
    "crates/storages/mysql",
    "crates/storages/mongodb",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/a14e/air-elt"
authors = ["Air Elt contributors"]

[workspace.dependencies]
air-elt-core = { path = "crates/core", version = "0.1.0" }
air-elt-commons = { path = "crates/commons/lib", version = "0.1.0" }
air-elt-commons-pg = { path = "crates/commons/pg", version = "0.1.0" }
air-elt-commons-mysql = { path = "crates/commons/mysql", version = "0.1.0" }
air-elt-commons-testing = { path = "crates/commons/testing", version = "0.1.0" }
air-elt-source-postgres = { path = "crates/sources/postgres", version = "0.1.0" }
air-elt-source-mysql = { path = "crates/sources/mysql", version = "0.1.0" }
air-elt-sink-postgres = { path = "crates/sinks/postgres", version = "0.1.0" }
air-elt-sink-mysql = { path = "crates/sinks/mysql", version = "0.1.0" }
air-elt-storage-postgres = { path = "crates/storages/postgres", version = "0.1.0" }
air-elt-storage-mysql = { path = "crates/storages/mysql", version = "0.1.0" }
air-elt-commons-mongodb = { path = "crates/commons/mongodb", version = "0.1.0" }
air-elt-source-mongodb = { path = "crates/sources/mongodb", version = "0.1.0" }
air-elt-source-mongo-cdc = { path = "crates/sources/mongo-cdc", version = "0.1.0" }
air-elt-sink-mongodb = { path = "crates/sinks/mongodb", version = "0.1.0" }
air-elt-storage-mongodb = { path = "crates/storages/mongodb", version = "0.1.0" }
air-elt-commons-clickhouse = { path = "crates/commons/clickhouse", version = "0.1.0" }
air-elt-sink-clickhouse = { path = "crates/sinks/clickhouse", version = "0.1.0" }

ahash = "0.8.12"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "test-util"] }
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.2"
serde_yaml = "=0.9.33"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "mysql", "macros", "migrate", "chrono", "uuid", "json", "bigdecimal"] }
num-bigint = { version = "0.4.6", features = ["serde"] }
bigdecimal = { version = "0.4.10", features = ["serde"] }
iso8601-duration = "0.2.0"
thiserror = "2.0.18"
anyhow = "1.0.102"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
clap = { version = "4.6.1", features = ["derive"] }
mimalloc = { version = "0.1.50", default-features = false }
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
futures = "0.3.32"
testcontainers = { version = "0.27.3", features = ["reusable-containers"] }
testcontainers-modules = { version = "0.15.0", features = ["postgres", "mysql", "mariadb", "mongo", "clickhouse"] }
# Direct bollard dep for the few places we drive the docker daemon
# without going through testcontainers (force-removing a stale ryuk
# between handshake retries). Pin matches testcontainers' transitive
# bollard so we don't end up with two versions linked.
bollard = { version = "0.20.0", default-features = false }
mongodb = { version = "3.6.0", default-features = false, features = ["rustls-tls", "bson-2", "compat-3-3-0"] }
bson = "2.15.0"
rand = "0.10.1"
tempfile = "3.27.0"
regex = "1.12.3"
once_cell = "1.21.4"
sha2 = "0.10.9"
mockall = "0.14.0"
quick-xml = "0.39.2"
base64 = "0.22.1"
hex = "0.4.3"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
lz4_flex = "0.11.5"

[profile.release]
lto = "thin"
codegen-units = 1

# Explicit `incremental = true` for dev/test even though it's the cargo
# default — guards against `CARGO_INCREMENTAL=0` leaking from the
# environment (some CI templates set it). We also keep `codegen-units`
# at the default 256 here for maximum parallelism on rebuild.
[profile.dev]
incremental = true

[profile.test]
incremental = true

[workspace.lints.rust]
# `deny` (not `forbid`) so narrow `#[allow(unsafe_code)]` can be applied at a
# single block — currently only in test helpers around `std::env::set_var`
# (edition-2024 marks it unsafe due to the read-race contract). Prod code
# carries zero `unsafe` blocks.
unsafe_code = "deny"

[workspace.lints.clippy]
# Nested `if` / `if let` is more readable than `&&` / let-chain fusion here —
# the project prefers explicit structure over clever flattening.
collapsible_if = "allow"
collapsible_else_if = "allow"
collapsible_match = "allow"
unwrap_used = "deny"
# `ValidationError` carries `DataType` (now Vec-bearing via `Union`),
# nudging it past the 128-byte threshold. Errors are not hot-path —
# the rare allocation cost is preferable to boxing every variant.
result_large_err = "allow"
