[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/core",
    "crates/commons/lib",
    "crates/commons/pg",
    "crates/commons/mysql",
    "crates/commons/testing",
    "crates/commons/mongodb",
    "crates/commons/clickhouse",
    "crates/sources/postgres",
    "crates/sources/mysql",
    "crates/sources/mongodb",
    "crates/sources/mongo-cdc",
    "crates/sinks/postgres",
    "crates/sinks/mysql",
    "crates/sinks/mongodb",
    "crates/sinks/clickhouse",
    "crates/commons/questdb",
    "crates/sinks/questdb",
    "crates/storages/postgres",
    "crates/storages/mysql",
    "crates/storages/mongodb",
    "crates/types",
    "crates/monitoring",
    "crates/self-lint",
    "crates/expr/types",
    "crates/expr/funcs",
    "crates/expr/expr",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/a14e/air-elt"
authors = ["Air Elt contributors"]

[workspace.dependencies]
air-elt-core = { path = "crates/core", version = "0.1.2" }
air-elt-types = { path = "crates/types", version = "0.1.2" }
air-elt-commons = { path = "crates/commons/lib", version = "0.1.2" }
air-elt-commons-pg = { path = "crates/commons/pg", version = "0.1.2" }
air-elt-commons-mysql = { path = "crates/commons/mysql", version = "0.1.2" }
air-elt-commons-testing = { path = "crates/commons/testing", version = "0.1.2" }
air-elt-source-postgres = { path = "crates/sources/postgres", version = "0.1.2" }
air-elt-source-mysql = { path = "crates/sources/mysql", version = "0.1.2" }
air-elt-sink-postgres = { path = "crates/sinks/postgres", version = "0.1.2" }
air-elt-sink-mysql = { path = "crates/sinks/mysql", version = "0.1.2" }
air-elt-storage-postgres = { path = "crates/storages/postgres", version = "0.1.2" }
air-elt-storage-mysql = { path = "crates/storages/mysql", version = "0.1.2" }
air-elt-commons-mongodb = { path = "crates/commons/mongodb", version = "0.1.2" }
air-elt-source-mongodb = { path = "crates/sources/mongodb", version = "0.1.2" }
air-elt-source-mongo-cdc = { path = "crates/sources/mongo-cdc", version = "0.1.2" }
air-elt-sink-mongodb = { path = "crates/sinks/mongodb", version = "0.1.2" }
air-elt-storage-mongodb = { path = "crates/storages/mongodb", version = "0.1.2" }
air-elt-commons-clickhouse = { path = "crates/commons/clickhouse", version = "0.1.2" }
air-elt-sink-clickhouse = { path = "crates/sinks/clickhouse", version = "0.1.2" }
air-elt-commons-questdb = { path = "crates/commons/questdb", version = "0.1.2" }
air-elt-sink-questdb = { path = "crates/sinks/questdb", version = "0.1.2" }
air-elt-monitoring = { path = "crates/monitoring", version = "0.1.2" }
air-elt-expr-types = { path = "crates/expr/types", version = "0.1.2" }
air-elt-expr-funcs = { path = "crates/expr/funcs", version = "0.1.2" }
air-elt-expr = { path = "crates/expr/expr", version = "0.1.2" }

aes = "0.8.4"
ahash = "0.8.12"
anyhow = "1.0.102"
async-trait = "0.1.89"
axum = { version = "0.8.6", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22.1"
bigdecimal = { version = "0.4.10", features = ["serde"] }
# Direct bollard dep for the few places we drive the docker daemon
# without going through testcontainers (force-removing a stale ryuk
# between handshake retries). Pin matches testcontainers' transitive
# bollard so we don't end up with two versions linked.
bollard = { version = "0.20.0", default-features = false }
bson = "2.15.0"
cbc = "0.1.2"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
data-encoding = "2.9.0"
encoding_rs = "0.8.35"
futures = "0.3.32"
gcm = "0.10.3"
hex = "0.4.3"
hmac = "0.12.1"
iso8601-duration = "0.2.0"
jsonpath-rust = "0.7.5"
lz4_flex = "0.11.5"
md-5 = "0.10.6"
mimalloc = { version = "0.1.50", default-features = false }
mockall = "0.14.0"
mongodb = { version = "3.6.0", default-features = false, features = ["rustls-tls", "bson-2", "compat-3-3-0"] }
num-bigint = { version = "0.4.6", features = ["serde"] }
num-traits = "0.2.19"
once_cell = "1.21.4"
parking_lot = "0.12.5"
prometheus = { version = "0.14.0", default-features = false }
proptest = "1.5.0"
quick-xml = "0.39.2"
rand = "0.10.1"
regex = "1.12.3"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["float_roundtrip"] }
serde_yaml = "=0.9.33"
sha1 = "0.10.6"
sha2 = "0.10.9"
sketches-ddsketch = "0.4.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "mysql", "macros", "migrate", "chrono", "uuid", "json", "bigdecimal", "ipnetwork"] }
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }
tempfile = "3.27.0"
test-strategy = "0.4.0"
testcontainers = { version = "0.27.3", features = ["reusable-containers"] }
testcontainers-modules = { version = "0.15.0", features = ["postgres", "mysql", "mariadb", "mongo", "clickhouse"] }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "test-util"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
urlencoding = "2.1.3"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.15", features = ["xxh32", "xxh64"] }
statrs = "0.18.0"
lambert_w = "2.0.3"

[profile.release]
lto = "thin"
codegen-units = 1

# Explicit `incremental = true` for dev/test even though it's the cargo
# default — guards against `CARGO_INCREMENTAL=0` leaking from the
# environment (some CI templates set it). We also keep `codegen-units`
# at the default 256 here for maximum parallelism on rebuild.
[profile.dev]
incremental = true

[profile.test]
incremental = true

[workspace.lints.rust]
# `deny` (not `forbid`) so narrow `#[allow(unsafe_code)]` can be applied at a
# single block — currently only in test helpers around `std::env::set_var`
# (edition-2024 marks it unsafe due to the read-race contract). Prod code
# carries zero `unsafe` blocks.
unsafe_code = "deny"

[workspace.lints.clippy]
# Nested `if` / `if let` is more readable than `&&` / let-chain fusion here —
# the project prefers explicit structure over clever flattening.
collapsible_if = "allow"
collapsible_else_if = "allow"
collapsible_match = "allow"
unwrap_used = "deny"
# `ValidationError` carries `DataType` (now Vec-bearing via `Union`),
# nudging it past the 128-byte threshold. Errors are not hot-path —
# the rare allocation cost is preferable to boxing every variant.
result_large_err = "allow"
# Forbid Box::leak — intentional memory leaks are prohibited in
# production code. Method names configured in clippy.toml.
disallowed_methods = "deny"
