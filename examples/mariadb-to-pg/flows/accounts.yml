flow:
  accounts:
    source: mariadb_src
    sink: pg_sink
    storage: pg_state

    from: source.accounts
    to: public.accounts

    batch-limit: 500

    # `ext` is a native `UUID` column on both ends — identity passthrough on
    # the type matrix, no runtime conversion needed.
    mapping:
      - { from: id, to: id }
      - { from: ext, to: ext }

    cursor:
      fields: ["id"]
      order: asc
      interval: "1s"
