[flow.users]
source = "mysql_src"
sink = "mysql_sink"
storage = "mysql_state"

from = "source.users"
to = "target.users"

batch-limit = 500

mapping = [
    { from = "id", to = "id" },
    { from = "name", to = "name" },
    { from = "created_at", to = "created_at" },
]

cursor = { fields = ["id"], order = "asc", interval = "1s" }
