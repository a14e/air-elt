[flow.users]
source = "mongo_src"
sink = "mysql_sink"
storage = "mongo_state"

# Mongo collection → fully-qualified MySQL table.
from = "users"
to = "target.users"

batch-limit = 500

# Dot-notation on the *source* path flattens a nested BSON subtree onto
# a flat SQL column. `addr.city` reads `users.addr.city` and writes it
# to the plain `city` column on the MySQL side.
mapping = [
    { from = "_id", to = "id" },
    { from = "name", to = "name" },
    { from = "addr.city", to = "city" },
]

cursor = { fields = ["_id"], order = "asc", interval = "1s" }

# Idempotent re-runs against the relational sink — `ON DUPLICATE KEY
# UPDATE` keyed on the BIGINT primary key.
[flow.users.conflict]
key = ["id"]
strategy = "overwrite"
