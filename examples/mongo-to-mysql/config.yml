config:
  include: ["flows"]

secrets:
  MONGO_SRC_URL: "mongodb://localhost:27017"
  MYSQL_SINK_URL: "mysql://root@localhost:3306/target"
  MONGO_STATE_URL: "mongodb://localhost:27017"

sources:
  - name: mongo_src
    type: mongodb
    config:
      url: "${MONGO_SRC_URL}"
      database: source

sinks:
  - name: mysql_sink
    type: mysql
    config:
      url: "${MYSQL_SINK_URL}"

storages:
  - name: mongo_state
    type: mongodb
    # Cursor state lands in the `air_elt_cursors` collection by default.
    # Override with `collection = "..."` if you need a different name.
    config:
      url: "${MONGO_STATE_URL}"
      database: state
