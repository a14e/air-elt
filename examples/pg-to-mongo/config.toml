[config]
include = ["flows"]

# `${VAR}` / `${VAR:default}` references are resolved at load time from process
# env first, then the `[secrets]` map below. Missing references with no default
# fail the validate step.

[secrets]
PG_SRC_URL = "postgres://postgres:postgres@localhost:5432/source"
MONGO_SINK_URL = "mongodb://localhost:27017"
PG_STATE_URL = "postgres://postgres:postgres@localhost:5432/state"

[[sources]]
name = "pg_src"
type = "postgres"
config = { url = "${PG_SRC_URL}" }

[[sinks]]
name = "mongo_sink"
type = "mongodb"
# Schemaless sink — `Sink::schemaless()` makes validate mirror the source's
# inferred schema instead of probing for declared columns. `[flow.<name>.conflict]`
# (see flows/users.toml) turns the writer into `replaceOne(upsert=true)`.
config = { url = "${MONGO_SINK_URL}", database = "target" }

[[storages]]
name = "pg_state"
type = "postgres"
config = { url = "${PG_STATE_URL}" }

# Optional. `enabled = true` alone exposes `/metrics` on the default
# port with sensible summary defaults (window = 5s, quantiles 0.5/0.9/0.99).
# Set `enabled = false` (or omit the whole block) to disable monitoring —
# the recorders compile to no-ops and no HTTP listener is started.
[metrics.prometheus]
enabled = true
# port = 8080
# prefix = "/metrics"
# summary = { window = "5s", bucket-granularity = "1s", quantiles = [0.5, 0.9, 0.99] }
