[flow.events]
source = "pg_src"
sink = "questdb_sink"
storage = "pg_state"

from = "public.events"
to = "events"

batch-limit = 500

cursor = { fields = ["ts"], order = "asc", interval = "5s" }

# pg-wire is the only transport. BINARY / IPv4 / DATE / LONG256 / GEOHASH
# all bind through sqlx; QuestDB coerces server-side per DDL.
[flow.events.mapping]
ts = "ts"              # designated timestamp
event_id = "event_id"  # LONG
payload = "payload"    # BINARY
src_ip = "src_ip"      # IPv4 (custom kind)
