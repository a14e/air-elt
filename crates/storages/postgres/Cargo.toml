[package]
name = "air-elt-storage-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
autotests = false

[lib]
doctest = false

[[test]]
name = "all"
path = "tests/all.rs"

[dependencies]
air-elt-core = { workspace = true }
air-elt-monitoring = { workspace = true }
air-elt-commons = { workspace = true }
air-elt-commons-pg = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
air-elt-commons-testing = { workspace = true }
# Used solely by the cursor-Custom round-trip integration test —
# `MongoObjectIdValue` is the only `DynValue` impl whose
# `cursor_compatible() == true` ships today.
air-elt-commons-mongodb = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
chrono = { workspace = true }
uuid = { workspace = true }
num-bigint = { workspace = true }
bigdecimal = { workspace = true }

[lints]
workspace = true
